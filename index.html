<!doctype html>
<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- App & SEO Identity -->
    <title>FitAdapt - Entrenamiento Personalizado Adaptativo</title>
    <meta name="description" content="Plataforma de entrenamiento personalizado y adaptativo con motor de reglas y compatibilidad biomecánica. Diseña rutinas seguras para casa o gimnasio respetando tu nivel y articulaciones." />
    <meta name="keywords" content="entrenamiento personalizado, fitness adaptativo, rutinas en casa, gimnasio, prevencion lesiones, calistenia, mancuernas, biomecanica, salud postural, PWA fitness" />
    <meta name="author" content="FitAdapt Team" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fitadapt.app/" />

    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitAdapt" />
    <meta name="application-name" content="FitAdapt" />
    <meta name="msapplication-TileColor" content="#0f172a" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitAdapt" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://fitadapt.app/" />
    <meta property="og:title" content="FitAdapt - Entrenamiento Personalizado Adaptativo" />
    <meta property="og:description" content="Entrenamiento inteligente que se adapta a tu cuerpo, equipamiento y limitaciones físicas. Sin dolor, con progresión real." />
    <meta property="og:image" content="/pwa-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitAdapt - Entrenamiento Personalizado Adaptativo" />
    <meta name="twitter:description" content="Entrenamiento inteligente que se adapta a tu cuerpo, equipamiento y limitaciones físicas." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- GEO & Structured Semantic Data (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FitAdapt",
      "operatingSystem": "All (Web, Android, iOS, Desktop)",
      "applicationCategory": "HealthApplication",
      "genre": "Fitness & Wellness",
      "description": "Plataforma de entrenamiento personalizada y adaptativa basada en reglas biomecánicas. Diseña rutinas por nivel, ubicación (casa o gimnasio), equipamiento y limitaciones articulares. Funciona completamente offline como Progressive Web App (PWA). No sustituye el diagnóstico o tratamiento médico.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Onboarding y perfil biomecánico integral",
        "Evaluación de compatibilidad articular y contraindicaciones",
        "Generador determinista de rutinas personalizadas",
        "Planificador semanal adaptable",
        "Entrenador de sesión activa con descansos y feedback RPE",
        "Registro de progreso con métricas de salud neutrales",
        "Asistente contextual FitAdapt AI con fallback local",
        "Soporte offline completo y sincronización local",
        "Instalación PWA en Android, iOS y Desktop"
      ],
      "audience": {
        "@type": "Audience",
        "audienceType": "Personas que desean entrenar de forma segura y consistente respetando su historial articular y tiempo disponible"
      }
    }
    </script>
  </head>
  <body class="h-full bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
